name: Public showcase
on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/showcase.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-showcase
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && VITE_SHOWCASE=true npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser check of static build
        working-directory: frontend
        run: |
          VITE_SHOWCASE=true npx vite preview --host 127.0.0.1 --port 4173 > /tmp/subguard-preview.log 2>&1 &
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/subguard/ > /dev/null
          npx playwright test -c playwright.showcase.config.ts
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
